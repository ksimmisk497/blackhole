 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask AI</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #faf9f6; color: #1f1e1b; display: flex; align-items: center; justify-content: center; }
  #open { background: #c4562f; color: #fff; border: 0; border-radius: 999px; padding: 14px 26px; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

  /* Dark backdrop. Clicking it closes the popup. */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
  #overlay.show { display: flex; }

  /* The popup box */
  #popup { position: relative; width: 100%; max-width: 420px; height: 600px; max-height: 100%; background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.35); overflow: hidden; }
  #popup iframe { width: 100%; height: 100%; border: 0; display: block; }
  #close { position: absolute; top: 6px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.08); color: #333; font-size: 20px; line-height: 1; cursor: pointer; z-index: 2; }
</style>
</head>
<body>
  <button id="open" type="button"> Ask AI</button>

  <div id="overlay" aria-hidden="true">
    <div id="popup" role="dialog" aria-modal="true" aria-label="Ask AI">
      <button id="close" type="button" aria-label="Close">×</button>
      <iframe src="" data-src="https://yellow-river-da3c.teokosuge8.workers.dev/" title="Ask AI"></iframe>
    </div>
  </div>

<script>
  const overlay = document.getElementById("overlay");
  const frame = overlay.querySelector("iframe");

  function openPopup() {
    if (!frame.src || frame.src === location.href) frame.src = frame.dataset.src; // load on first open
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden", "false");
  }
  function closePopup() {
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden", "true");
  }

  document.getElementById("open").addEventListener("click", openPopup);
  document.getElementById("close").addEventListener("click", closePopup);
  // Close when clicking the dark area outside the popup
  overlay.addEventListener("click", e => { if (e.target === overlay) closePopup(); });
  // Close with the Escape key
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });
</script>
</body>
</html>
