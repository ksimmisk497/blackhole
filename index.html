<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open 15</title>
</head>
<body>
  <button id="go">Open 15 windows</button>
  <script>
    document.getElementById("go").onclick = function () {
      for (var i = 0; i < 15; i++) {
        window.open(
          "pornhub.com",
          "pornhub_" + i,
          "width=800,height=600"
        );
      }
    };
  </script>
</body>
</html>
