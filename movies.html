<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Blackhole</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="canvas-favicon.svg">
  <link rel="stylesheet" href="fonts/local.css">
  <link rel="stylesheet" href="browser.css">
  <script src="cloak.js"></script>
  <script src="notifications.js"></script>
  <script src="browser-ua.js"></script>
  <style>
    #movies-inner {
      padding: 40px 20px 100px;
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      font-family: 'Open Sans', system-ui, sans-serif;
    }
    #movies-hero {
      margin-bottom: 28px;
    }
    #movies-hero img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      border: 1px solid rgba(255,122,47,0.35);
      box-shadow: 0 0 0 4px rgba(255,122,47,0.1), 0 12px 40px rgba(0,0,0,0.45);
    }
    #movies-hero h1 {
      margin: 18px 0 8px;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    #movies-hero p {
      margin: 0 auto;
      max-width: 420px;
      color: #8a8a9a;
      font-size: 14px;
      line-height: 1.55;
    }
    .movies-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 28px 0 36px;
    }
    .movies-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform .15s, box-shadow .2s, background .2s, border-color .2s;
      text-decoration: none;
      color: #fff;
    }
    .movies-btn.primary {
      background: linear-gradient(135deg, #ff7a2f, #ff9a4a);
      box-shadow: 0 8px 28px rgba(255,122,47,0.35);
    }
    .movies-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255,122,47,0.45);
    }
    .movies-btn.secondary {
      background: rgba(20,20,28,0.9);
      border-color: #2a2a35;
      color: #d0d0e0;
    }
    .movies-btn.secondary:hover {
      border-color: rgba(255,122,47,0.5);
      color: #fff;
      transform: translateY(-1px);
    }
    .movies-note {
      font-size: 12px;
      color: #555;
      max-width: 400px;
      margin: 0 auto 24px;
      line-height: 1.45;
    }
    .movies-note strong { color: #777; }
    #recent-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      min-height: 18px;
    }
  </style>
  <script>
    document.title = 'Blackhole';
  </script>
</head>
<body>

  <div id="bh-bg" aria-hidden="true">
    <img src="bg-blackhole.webp" alt="" decoding="async" fetchpriority="high">
  </div>

  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-blob a"></div>
    <div class="ambient-blob b"></div>
    <div class="ambient-blob c"></div>
  </div>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <div id="browser-chrome">
    <div id="tab-bar">
      <div class="tab active" id="home-tab" onclick="BrowserTabs.switchTab('home')">
        <img class="tab-favicon" src="movie.png" onerror="this.src='favicon.png'; this.onerror=null;">
        <span class="tab-title">Movies</span>
      </div>
      <button id="new-tab-btn" onclick="BrowserTabs.openTab(null)" title="New Tab">+</button>
    </div>
    <div id="address-bar-row">
      <button class="nav-btn" id="btn-back" onclick="BrowserTabs.tabBack()" title="Back">&#8592;</button>
      <button class="nav-btn" id="btn-forward" onclick="BrowserTabs.tabForward()" title="Forward">&#8594;</button>
      <button class="nav-btn" id="btn-reload" onclick="BrowserTabs.tabReload()" title="Reload">&#8635;</button>
      <input id="address-input" class="home-tab" type="text" value="Movies" autocomplete="off"
             onfocus="BrowserTabs.addressFocus()" onblur="BrowserTabs.addressBlur()"
             onkeydown="if(event.key==='Enter')BrowserTabs.addressGo()">
      <button class="nav-btn" onclick="BrowserTabs.switchTab('home')" title="Home">⌂</button>
    </div>
  </div>
  <div id="chrome-height-spacer"></div>
  <div id="tab-content-area">
    <div id="home-frame" class="active">
      <div id="movies-inner">
        <div id="movies-hero">
          <img src="movie.png" alt="Movies">
          <h1>Movies</h1>
          <p>Stream movies &amp; TV shows with Breeze — same interface as cherri-education.online, opened through Blackhole so it stays in the proxy.</p>
        </div>

        <div class="movies-actions">
          <button type="button" class="movies-btn primary" id="btn-open-breeze">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h20M2 15h20"/></svg>
            Reopen Breeze
          </button>
</div>

        <p class="movies-note">
          Opening Breeze through the proxy…
        </p>
        <div id="recent-hint"></div>
      </div>
    </div>
  </div>

  <script src="uv/uv.bundle.js" defer></script>
  <script src="uv/uv.config.js" defer></script>
  <script src="register-sw.js" defer></script>
  <script src="search.js" defer></script>
  <script src="browser.js" defer></script>
  <script>
    (function warm() {
      if (typeof __uv$config === 'undefined' || typeof registerSW !== 'function') {
        return setTimeout(warm, 50);
      }
      registerSW().catch(function () {});
    })();
  </script>
  <script defer>
    var BREEZE_URL = 'https://cherri-education.online/#/movies';

    function openBreeze() {
      if (window.BrowserTabs && typeof BrowserTabs.openTab === 'function') {
        BrowserTabs.openTab(BREEZE_URL, 'Breeze');
      } else {
        // Fallback only if tabs not ready yet
        setTimeout(function () {
          if (window.BrowserTabs && typeof BrowserTabs.openTab === 'function') {
            BrowserTabs.openTab(BREEZE_URL, 'Breeze');
          }
        }, 200);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (window.BrowserTabs) BrowserTabs.init({ homeLabel: 'Movies' });

      var btn = document.getElementById('btn-open-breeze');
      if (btn) btn.addEventListener('click', openBreeze);

      // Always auto-open Breeze when you open the Movies tab (proxy tab, not a new window)
      function tryOpen() {
        if (window.BrowserTabs && typeof BrowserTabs.openTab === 'function') {
          openBreeze();
          return;
        }
        setTimeout(tryOpen, 100);
      }
      setTimeout(tryOpen, 150);
    });
  </script>
  <script>
  (function () {
    var canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dots = [];
    var colors = ['#ff7a2f', '#ff7a2f', '#ffb347', '#ffd4a8'];
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var count = Math.min(50, Math.floor((canvas.width * canvas.height) / 22000));
      dots = [];
      for (var i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 2 + 0.7,
          c: colors[(Math.random() * colors.length) | 0],
          a: Math.random() * 0.35 + 0.2,
          tw: Math.random() * Math.PI * 2,
          tws: 0.02 + Math.random() * 0.03
        });
      }
    }
    window.addEventListener('resize', resize);
    resize();
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        p.tw += p.tws;
        var twinkle = 0.55 + 0.45 * Math.sin(p.tw);
        ctx.beginPath();
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.min(1, p.a * twinkle);
        ctx.arc(p.x, p.y, p.r * (0.85 + 0.25 * twinkle), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>

  <nav class="bh-dock" aria-label="Main">
    <a href="index.html" data-label="Home">
      <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
    </a>
    <a href="games.html" data-label="Games">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="3"/><path d="M8 12h2M7 10v4M16 11h.01M18 13h.01"/></svg>
    </a>
    <a href="apps.html" data-label="Apps">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
    </a>
    <a href="ai.html" data-label="AI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="10" rx="2"/><line x1="12" y1="8" x2="12" y2="5"/><circle cx="12" cy="4" r="1"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><line x1="9.5" y1="16" x2="14.5" y2="16"/><line x1="5" y1="12" x2="3" y2="12"/><line x1="19" y1="12" x2="21" y2="12"/></svg>
    </a>

    <a href="movies.html" class="active" data-label="Movies">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h20M2 15h20"/></svg>
    </a>
    <a href="settings.html" data-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </a>
    <span class="bh-dock-sep" aria-hidden="true"></span>
    <a href="#" class="bh-notify-btn" data-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span class="bh-notify-dot" style="display:none">0</span>
    </a>
  </nav>

</body>
</html>
