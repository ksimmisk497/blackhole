100% { background-position: -200% 0; } }

      document.title = desired();
      setInterval(function () {

    })();

  <script>
  (function () {
    function titleFromFile(name) {
      var t = String(name || '');
      if (t.indexOf('cl') === 0) t = t.slice(2);
      t = t.replace(/\.(html?|txt|docx)$/i, '');
      t = t.replace(/([a-z])([A-Z])/g, '$1 $2');
      t = t.replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
      t = t.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
      return t || name;
    }

    function letterOf(title) {
      var c = (title || '#').charAt(0).toUpperCase();
      return /[A-Z]/.test(c) ? c : '#';
    }

    function openLocalGame(file, title) {
      var path = 'vendor/games/' + file;
      // absolute-from-site path for GH pages subpath
      try {
        path = new URL('vendor/games/' + encodeURI(file), location.href).pathname;
        // keep relative for portability
        path = 'vendor/games/' + file.split('/').map(encodeURIComponent).join('/');
      } catch (e) {
        path = 'vendor/games/' + file;
      }
      if (window.BrowserTabs && BrowserTabs.openTab) {
        BrowserTabs.openTab(path, title || titleFromFile(file));
      } else {
        location.href = path;
      }
    }
    window.openLocalGame = openLocalGame;

    function renderGames(list) {
      var container = document.getElementById('sections-container');
      if (!container) return;
      container.innerHTML = '';
      var byLetter = {};
      list.forEach(function (g) {
        var L = g.letter || letterOf(g.title);
        if (!byLetter[L]) byLetter[L] = [];
        byLetter[L].push(g);
      });
      Object.keys(byLetter).sort(function (a, b) {
        if (a === '#') return 1;
        if (b === '#') return -1;
        return a.localeCompare(b);
      }).forEach(function (L) {
        var sec = document.createElement('div');
        sec.className = 'letter-section';
        var h = document.createElement('div');
        h.className = 'letter-header';
        h.textContent = L;
        sec.appendChild(h);
        var grid = document.createElement('div');
        grid.className = 'buttons-grid';
        byLetter[L].sort(function (a, b) {
          return a.title.toLowerCase().localeCompare(b.title.toLowerCase());
        }).forEach(function (g) {
          var btn = document.createElement('input');
          btn.type = 'button';
          btn.value = g.title;
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            openLocalGame(g.file, g.title);
          });
          grid.appendChild(btn);
        });
        sec.appendChild(grid);
        container.appendChild(sec);
      });
    }

    function boot() {
      if (window.BrowserTabs) BrowserTabs.init({ homeLabel: 'Games' });

      fetch('vendor/games-manifest.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (list) {
          window.__blackholeGames = list;
          renderGames(list);
        })
        .catch(function () {
          // fallback: build from embedded minimal list
          var fallback = [];
          renderGames(fallback);
          var c = document.getElementById('sections-container');
          if (c) c.innerHTML = '<p style="color:#888;text-align:center;padding:20px">No local games found. Put HTML files in vendor/games/ and rebuild manifest.</p>';
        });

      var searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          var q = searchInput.value.trim().toLowerCase();
          var list = window.__blackholeGames || [];
          if (!q) { renderGames(list); return; }
          renderGames(list.filter(function (g) {
            return (g.title || '').toLowerCase().indexOf(q) !== -1 ||
                   (g.file || '').toLowerCase().indexOf(q) !== -1;
          }));
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else boot();
  })();
  </script>

  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <script>
  (function () {
    var canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dots = [];
    var mouse = { x: -9999, y: -9999 };
    var colors = ['#ff7a2f', '#ff7a2f', '#ffb347', '#ffd4a8'];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var count = Math.min(70, Math.floor((canvas.width * canvas.height) / 18000));
      dots = [];
      for (var i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: Math.random() * 2 + 0.8,
          c: colors[(Math.random() * colors.length) | 0],
          a: Math.random() * 0.4 + 0.28,
          tw: Math.random() * Math.PI * 2,
          tws: 0.02 + Math.random() * 0.04
        });
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', function (e) {
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
    resize();

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        for (var j = i + 1; j < dots.length; j++) {
          var q = dots[j];
          var dx = p.x - q.x, dy = p.y - q.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 140) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,122,47,' + (0.32 * (1 - d / 140)).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
        var mdx = mouse.x - p.x, mdy = mouse.y - p.y;
        var md = Math.sqrt(mdx * mdx + mdy * mdy);
        if (md < 140) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(167,139,250,' + (0.38 * (1 - md / 150)).toFixed(3) + ')';
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
        p.tw += p.tws || 0.03;
        var twinkle = 0.55 + 0.45 * Math.sin(p.tw || 0);
        // occasional stronger pulse
        if (((Math.sin(p.tw * 0.35) + 1) * 0.5) > 0.97) twinkle = 1;
        ctx.beginPath();
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.min(1, (p.a || 0.3) * twinkle);
        ctx.arc(p.x, p.y, p.r * (0.85 + 0.25 * twinkle), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
